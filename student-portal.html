/* المسار النجمي النابض */
@keyframes starPulse {
    0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
    50% {
        transform: scale(1.12);
        box-shadow: 0 0 25px rgba(212, 175, 55, 0.8),

    }
    100% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }
}

@keyframes ringPing {
    0% {
        transform: scale(1);
        opacity: 0.8;
    }
    100% {
        transform: scale(1.6);
        opacity: 0;
    }
}

.pulsing-star {
    animation: starPulse 2s ease-in-out infinite;
}

.ping-ring {
    animation: ringPing 2s cubic-bezier(0, 0, 0.2, 1) infinite;
}

.orbit-ring {

}

.radar-sweep {

}

@keyframes spin-slow {

}

.animate-spin-slow {

}

function friendlyError(e){
 const t=e?.message||String(e||'حدث خطأ غير معروف');
 if(/Invalid login credentials/i.test(t))return'الكود أو كلمة المرور غير صحيحة.';

function normalizeOptions(raw){
 if(Array.isArray(raw))return raw.map(item=>{
  if(item&&typeof item==='object'){const val=item.text??item.label??item.value??item.answer??'';const label=item.label??item.text??item.answer??item.value??'';return{value:String(val),label:String(label)};}

 }).filter(x=>x.label!=='');

}

function populateHomeData(c) {
 const count = $('home-radar-count');
 const list = $('home-radar-list');
 if (!count || !list) return;

 const tasks = [];

 if (c) {
  (c.weekly_exams || []).forEach(e => {
   if (!hasExamResult(e)) {
    tasks.push({
     title: e.title || 'اختبار أسبوعي',
     detail: 'اختبار أسبوعي',
     action: `portalOpenExam(${Number(e.id)},'course',${Number(c.id)},null)`
    });
   }
  });

  (c.subjects || []).forEach(s => {
   (s.assignments || []).forEach(a => {
    if (!isSubmittedAssignment(a)) {
     tasks.push({
      title: a.title || 'تكليف جديد',
      detail: 'تكليف · ' + (s.name || 'المادة'),
      action: `portalOpenAssignment(${Number(c.id)},${Number(s.id)},${Number(a.id)})`
     });
    }
   });

   const e = s.final_exam;
   if (e && !hasExamResult(e)) {
    tasks.push({
     title: e.title || 'الامتحان النهائي',
     detail: 'امتحان نهائي · ' + (s.name || 'المادة'),
     action: `portalOpenExam(${Number(e.id)},'subject',${Number(c.id)},${Number(s.id)})`
    });
   }
  });
 }

 count.textContent = tasks.length;

 if (!tasks.length) {
  list.innerHTML = `
   <div class="text-xs text-creamMuted p-4 rounded-xl bg-black/30 border border-creamBase/10 text-center">
    لا توجد تكاليف أو اختبارات تنتظر إنجازك حالياً.

 `).join('');
}

       class="text-xs text-creamMuted text-center mt-2">
        جارٍ حساب إنجازك الفعلي…
    </p>
</div>
`;
 
 const weekly = c?.weekly_exams || [];
 const subjects = c?.subjects || [];

 const stages = [
  {
   items: weekly,
   done: e => hasExamResult(e)
  },
  {
   items: subjects.flatMap(s => s.assignments || []),
   done: a => isSubmittedAssignment(a)
  },
  {
   items: subjects.map(s => s.final_exam).filter(Boolean),
   done: e => hasExamResult(e)
  }
 ];

 const allTasks = stages.flatMap(stage => stage.items);
 const total = allTasks.length;

 const done = stages.reduce(
  (sum, stage) => sum + stage.items.filter(stage.done).length,
  0
 );

 const percent = total ? Math.round(done / total * 100) : 0;

 const pct = $('home-path-percent');
 if (pct) pct.textContent = percent + '%';

 const line = $('home-path-line');
 if (line) line.style.width = percent + '%';

 for (let star = 1; star <= 5; star++) {
  const reached = total > 0 && percent >= star * 20;
  const next = total > 0 &&
   percent < star * 20 &&
   percent >= (star - 1) * 20;

  const icon = $(`[data-star-icon="${star}"]`);
  const label = $(`[data-star-label="${star}"]`);
  const ping = $(`[data-star-ping="${star}"]`);

  if (icon) {
   icon.className =
    'relative w-9 h-9 rounded-full flex items-center justify-center text-sm font-black transition-all duration-500 ' +
    (
     reached
      ? 'bg-[#D4AF37] text-[#070E17] border-2 border-[#F5E6D3]'
      : next
       ? 'bg-[#070E17] border-2 border-[#D4AF37] text-[#D4AF37] pulsing-star'
       : 'bg-black/60 border border-[#F5E6D3]/30 text-[#9AA8B8]'
    );

   icon.textContent = reached ? '✓' : '★';
  }

  if (label) {
   label.className =
    'text-[10px] sm:text-xs text-center ' +
    (reached || next
     ? 'text-[#D4AF37] font-black'
     : 'text-[#9AA8B8] font-medium');
  }

  if (ping) ping.classList.toggle('hidden', !next);
 }

 const summary = $('home-path-summary');

 if (summary) {
  summary.textContent = total
   ? `أنجزت ${done} من ${total} مهمة مطلوبة — ${percent}٪ من المساق.`
   : 'لا توجد اختبارات أو تكاليف مطلوبة في هذا المساق حتى الآن.';
 }

 populateHomeData(c);
}

    <i class="fa-solid fa-arrow-right ml-1"></i> رجوع للمساق
   </button>
   <h2 class="text-xl font-bold text-creamBase">${esc(s.name)}</h2>
  </div>
  <section>
   <h3 class="text-base font-bold text-creamBase mb-3">تكاليف المادة</h3>
   ${assignments.length?`<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${assignments.map(a=>`
    <article class="p-4 rounded-xl bg-black/40 border border-creamBase/20 flex flex-col justify-between">
     <div>
      <h3 class="text-sm font-bold text-creamBase">${esc(a.title)}</h3>
      <p class="text-xs font-bold ${a.submission?.submitted_at||a.submission?.submitted?'text-emerald-400':'text-goldLogo'} mt-2">الحالة: ${a.submission?.submitted_at||a.submission?.submitted?'تم التسليم':'لم يتم التسليم'}</p>
     </div>
     <button class="w-full mt-4 py-2 cream-gradient text-navyDark font-bold rounded-lg text-xs" onclick="portalOpenAssignment(${Number(c.id)},${Number(s.id)},${Number(a.id)})">عرض التكليف</button>
    </article>`).join('')}</div>`:'<div class="text-xs text-creamMuted p-4 rounded-xl bg-black/20 text-center">لا توجد تكاليف.</div>'}
  </section>
  <section>
   <h3 class="text-base font-bold text-creamBase mb-3">الامتحان النهائي للمادة</h3>
   ${f?`<article class="p-4 rounded-xl bg-black/40 border border-creamBase/20 flex flex-col justify-between">
    <div><h3 class="text-sm font-bold text-creamBase">${esc(f.title)}</h3>${f.result?`<p class="text-xs font-bold text-emerald-400 mt-2">النتيجة: ${esc(f.result.score)} / ${esc(f.result.total)}</p>`:''}</div>
    <button class="w-full mt-4 py-2 bg-navyDark border border-creamBase/30 text-creamBase font-bold rounded-lg text-xs" onclick="portalOpenExam(${Number(f.id)},'subject',${Number(c.id)},${Number(s.id)})">فتح الامتحان</button>
   </article>`:'<div class="text-xs text-creamMuted p-4 rounded-xl bg-black/20 text-center">لا يوجد امتحان نهائي مضاف.</div>'}
  </section>
 </div>`;
}

function openAssignment(courseId, subjectId, assignmentId) {
 const c = (dashboard?.courses || []).find(
  x => Number(x.id) === Number(courseId)
 );
 const s = c?.subjects?.find(
  x => Number(x.id) === Number(subjectId)
 );
 const a = s?.assignments?.find(
  x => Number(x.id) === Number(assignmentId)
 );

 if (!c || !s || !a) return;

 const submitted = isSubmittedAssignment(a);

 view.innerHTML = `
 <div class="max-w-4xl mx-auto space-y-6 pb-8">

  <div class="flex items-center justify-between gap-3 flex-wrap">
   <button
    type="button"
    class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl border border-creamBase/20 bg-black/20 text-creamBase hover:bg-black/40 transition"
    onclick="portalOpenSubject(${Number(c.id)},${Number(s.id)})">
    <i class="fa-solid fa-arrow-right"></i>
    <span class="text-sm font-bold">العودة للمادة</span>
   </button>

   <span class="text-xs text-creamMuted">
    <i class="fa-solid fa-book-open ml-1"></i>
    ${esc(c.name || c.title || 'المساق')}
   </span>
  </div>

  <section class="glass-panel rounded-2xl p-5 md:p-8 space-y-6">

   <header class="border-b border-creamBase/15 pb-5">
    <div class="flex items-start gap-4">
     <div class="shrink-0 w-12 h-12 rounded-2xl bg-goldLogo/10 border border-goldLogo/30 flex items-center justify-center">
      <i class="fa-solid fa-clipboard-list text-goldLogo text-xl"></i>
     </div>

     <div class="flex-1 min-w-0">
      <p class="text-xs font-bold text-goldLogo mb-2">التكليف الدراسي</p>
      <h2 class="text-xl md:text-2xl font-bold text-creamBase leading-relaxed">
       ${esc(a.title)}
      </h2>
      <p class="text-sm text-creamMuted mt-2">
       ${esc(s.name || s.title || 'المادة')}
      </p>
     </div>
    </div>
   </header>

   ${a.description ? `
    <section class="rounded-xl p-4 md:p-5 bg-black/20 border border-creamBase/10">
     <h3 class="text-sm font-bold text-goldLogo mb-3">
      <i class="fa-solid fa-circle-info ml-2"></i>
      تعليمات التكليف
     </h3>
     <p class="text-sm md:text-base text-creamLight leading-8 whitespace-pre-wrap">
      ${esc(a.description)}
     </p>
    </section>
   ` : ''}

   ${a.question_text ? `
    <section class="rounded-xl p-4 md:p-6 bg-black/25 border border-goldLogo/25">
     <div class="flex items-center gap-2 mb-4">
      <span class="w-8 h-8 rounded-lg bg-goldLogo/15 flex items-center justify-center">
       <i class="fa-solid fa-circle-question text-goldLogo"></i>
      </span>
      <h3 class="text-base font-bold text-goldLogo">السؤال المطلوب</h3>
     </div>

     <div class="text-sm md:text-base text-creamLight leading-8 whitespace-pre-wrap break-words">
      ${esc(a.question_text)}
     </div>
    </section>
   ` : ''}

   ${submitted ? `
    <section class="rounded-xl p-5 bg-emerald-950/25 border border-emerald-500/30">
     <div class="flex items-start gap-3">
      <i class="fa-solid fa-circle-check text-emerald-400 text-2xl mt-1"></i>
      <div class="space-y-2">
       <h3 class="text-base font-bold text-emerald-400">
        تم تسليم التكليف بنجاح
       </h3>
       <p class="text-sm text-creamLight leading-7">
        تم تسجيل إجابتك. يمكنك العودة إلى صفحة المادة.
       </p>
       ${a.submission.grade != null ? `
        <p class="text-sm font-bold text-emerald-300">
         الدرجة: ${esc(a.submission.grade)}
        </p>
       ` : ''}
      </div>
     </div>
    </section>
   ` : `
    <section class="space-y-4">
     <div>
      <h3 class="text-base font-bold text-creamBase mb-2">
       <i class="fa-solid fa-pen-to-square text-goldLogo ml-2"></i>
       اكتبي إجابتك
      </h3>
      <p class="text-sm text-creamMuted leading-7">
       راجعي السؤال والتعليمات جيدًا، ثم اكتبي إجابتك في المساحة التالية.
      </p>
     </div>

     <form id="assignment-form" class="space-y-4">
      <textarea
       id="assignment-answer"
       rows="10"
       maxlength="20000"
       required
       placeholder="اكتبي إجابتك هنا..."
       class="w-full min-h-56 p-4 md:p-5 bg-black/25 border border-creamBase/20 rounded-xl text-creamLight text-base leading-8 placeholder:text-creamMuted/60 focus:outline-none focus:border-goldLogo/70 transition resize-y"
      ></textarea>

      <div class="flex items-start gap-2 text-xs text-creamMuted leading-6">
       <i class="fa-solid fa-circle-info mt-1 text-goldLogo"></i>
       <p>تأكدي من مراجعة إجابتك قبل الضغط على زر التسليم.</p>
      </div>

      <button
       class="w-full sm:w-auto inline-flex justify-center items-center gap-2 px-7 py-3.5 cream-gradient text-navyDark font-bold rounded-xl text-sm shadow-md disabled:opacity-50 disabled:cursor-not-allowed transition"
       type="submit">
       <i class="fa-solid fa-paper-plane"></i>
       تسليم التكليف
      </button>
     </form>

     <p id="assignment-message" role="status" aria-live="polite"
        class="text-sm leading-7"></p>
    </section>
   `}

  </section>
 </div>`;

 if (!submitted) {
  $('assignment-form').addEventListener('submit', async ev => {
   ev.preventDefault();

   const form = $('assignment-form');
   const button = form.querySelector('button');
   const answer = $('assignment-answer').value.trim();

   if (!answer) {
    message('assignment-message', 'من فضلك اكتبي إجابتك أولًا.', 'error');
    return;
   }

   button.disabled = true;
   message('assignment-message', 'جارٍ تسليم التكليف…');

   const { error } = await client.rpc('submit_student_assignment', {
    p_assignment_id: Number(assignmentId),
    p_submission_text: $('assignment-answer').value
   });

   if (error) {
    message('assignment-message', friendlyError(error), 'error');
    button.disabled = false;
    return;
   }

   message('assignment-message', 'تم التسليم بنجاح.', 'success');

   try {
    await refreshDashboard({ render: false });
    openSubject(courseId, subjectId);
   } catch (e) {}
  });
 }
}


async function openExam(examId,parentType,courseId,subjectId){
 examParent=parentType==='subject'?{type:'subject',courseId:Number(courseId),subjectId:Number(subjectId)}:{type:'course',courseId:Number(courseId)};
 view.innerHTML=`<div class="glass-panel rounded-2xl p-6 text-center text-xs text-creamMuted">جارٍ تحميل الامتحان…</div>`;
 const{data,error}=await client.rpc('get_student_exam',{p_exam_id:Number(examId)});
 if(error){view.innerHTML=`<div class="glass-panel rounded-2xl p-6 text-center text-xs text-red-400">${esc(friendlyError(error))}</div>`;return;}
 renderExam(data);
}

function renderExam(data){
 const exam=data.exam||{},state=data.state;
 let content=`
 <div class="glass-panel rounded-2xl p-6 space-y-6">
  <div class="flex items-center gap-4 border-b border-creamBase/15 pb-4">
   <button class="px-3 py-1.5 rounded-lg bg-black/40 border border-creamBase/30 text-creamBase text-xs font-bold" onclick="portalBackFromExam()">
    <i class="fa-solid fa-arrow-right ml-1"></i> رجوع
   </button>
   <h2 class="text-xl font-bold text-creamBase">${esc(exam.title||'الامتحان')}</h2>
  </div>`;
 
 if(state==='submitted'){
  const pending=Number(data.result?.pending_manual_count||0);
  content+=`<div class="p-6 rounded-xl bg-emerald-950/30 border border-emerald-500/30 text-center">
   <h3 class="text-lg font-bold text-emerald-400 mb-2">تم تسليم الامتحان</h3>
   <p class="text-base font-extrabold text-creamBase">${pending?'توجد إجابات مقالية بانتظار التصحيح.':`النتيجة: ${esc(data.result?.score??'—')} / ${esc(data.result?.total??'—')}`}</p>
  </div></div>`;
  view.innerHTML=content;return;
 }
 if(state==='upcoming'||state==='closed'||state==='course_completed'){
  content+=`<div class="p-6 rounded-xl bg-black/40 border border-creamBase/20 text-center text-xs font-bold text-creamMuted">${state==='upcoming'?'الامتحان لم يفتح بعد.':state==='closed'?'انتهى موعد الامتحان.':'المساق مكتمل.'}</div></div>`;
  view.innerHTML=content;return;
 }
 const questions=data.questions||[];
 content+=`<form id="exam-form" class="space-y-6">`;
 content+=questions.map((q,i)=>{
  const opts=normalizeOptions(q.options),multi=q.question_type==='multiple_select',type=q.question_type||'';
  const body=opts.length?opts.map(o=>`
   <label class="flex items-center gap-3 p-3 rounded-xl bg-black/40 border border-creamBase/20 cursor-pointer">
    <input type="${multi?'checkbox':'radio'}" name="question-${Number(q.id)}" value="${esc(o.value)}" class="accent-goldLogo">
    <span class="text-xs font-medium text-creamLight">${esc(o.label)}</span>
   </label>`).join(''):`
   <div class="mt-2">
    <textarea id="answer-${Number(q.id)}" name="question-${Number(q.id)}" ${type==='essay'?'rows="4"':''} class="w-full p-3 bg-black/40 border border-creamBase/30 rounded-xl text-xs text-creamLight focus:outline-none"></textarea>
   </div>`;
  return`<div class="p-5 rounded-xl bg-black/30 border border-creamBase/20 space-y-3">
   <h3 class="text-sm font-bold text-creamBase">السؤال ${i+1}</h3>
   <p class="text-xs text-creamLight whitespace-pre-wrap">${esc(q.question_text||'')}</p>
   <div class="space-y-2 pt-2">${body}</div>
  </div>`;
 }).join('');
 content+=`<button class="w-full py-3 cream-gradient text-navyDark font-black rounded-xl text-sm shadow-lg" type="submit">إنهاء وتسليم الامتحان</button></form></form>`;
 view.innerHTML=content;

 $('exam-form').addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(!confirm('هل تريدين تسليم الامتحان؟'))return;
  const answers=questions.map(q=>{
   const opts=normalizeOptions(q.options);
   let answer;
   if(q.question_type==='multiple_select'){
    answer=JSON.stringify(Array.from(view.querySelectorAll(`input[name="question-${Number(q.id)}"]:checked`)).map(x=>x.value));
   }else if(opts.length){
    answer=view.querySelector(`input[name="question-${Number(q.id)}"]:checked`)?.value||'';
   }else{
    answer=$(`answer-${Number(q.id)}`)?.value||'';
   }
   return{question_id:Number(q.id),answer};
  }).filter(x=>x.answer!=='');

  const{data:result,error}=await client.rpc('submit_student_exam',{p_exam_id:Number(exam.id),p_answers:answers});
  if(error){alert(friendlyError(error));return;}
  renderExam({state:'submitted',exam,result});
  try{await refreshDashboard({render:false});}catch(_){}
 });
}

function portalBackFromExam(){
 if(examParent.type==='subject')openSubject(examParent.courseId,examParent.subjectId);
 else if(examParent.type==='course')openCourse(examParent.courseId);
 else switchTab('exams');
}

// تسجيل الدخول والخروج
$('login-form').addEventListener('submit',async ev=>{
 ev.preventDefault();
 const code=$('student-code').value.trim(),password=$('student-password').value;
 if(!code||!password)return;
 const b=$('login-button');
 b.disabled=true;
 message('login-message','جارٍ تسجيل الدخول…');
 const{error}=await client.auth.signInWithPassword({email:`student.${code.toLowerCase()}@login.invalid`,password});
 b.disabled=false;
 if(error){message('login-message',friendlyError(error),'error');return;}
 // نجاح المصادقة يعني أن الطالب دخل بالفعل؛ فشل تحميل بيانات اللوحة
 // لا ينبغي أن يمسح جلسة الدخول أو يعيده إلى شاشة الدخول.
 showSignedIn();
 try{
  await refreshDashboard();
  switchTab('home');
  message('login-message','');
  message('app-message','');
 }catch(e){
  message('app-message','تم تسجيل الدخول بنجاح، لكن تعذّر تحميل بيانات البوابة: '+friendlyError(e),'error');
  message('login-message','');
 }
});

async function logout(){
 try{
  const{error}=await client.auth.signOut();
  if(error)throw error;
  window.location.replace('index.html');
 }catch(e){
  alert('تعذر تسجيل الخروج: '+friendlyError(e));
 }
}
document.querySelectorAll('#logout-button, #header-logout').forEach(b=>b.addEventListener('click',logout));

window.portalOpenCourse=openCourse;
window.portalOpenSubject=openSubject;
window.portalOpenAssignment=openAssignment;
window.portalOpenExam=openExam;
window.portalBackFromExam=portalBackFromExam;
window.switchTab=switchTab;

(async()=>{
 const {data,error:sessionError}=await client.auth.getSession();
 if(sessionError){
  message('login-message','تعذّر استعادة جلسة الدخول: '+friendlyError(sessionError),'error');
  return;
 }
 if(!data?.session)return;
 showSignedIn();
 try{
  await refreshDashboard();
  switchTab('home');
  message('app-message','');
 }catch(e){
  // نحتفظ بالجلسة ونوضح الخطأ بدل تسجيل الخروج تلقائيًا.
  message('app-message','تم استعادة جلسة الدخول، لكن تعذّر تحميل بيانات البوابة: '+friendlyError(e),'error');
 }
})();
})();
</script>
