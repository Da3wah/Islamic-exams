
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a1930">
<title>تسجيل الدخول | مَرْصَد</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --navy: #0a1930;
  --gold: #d0aa67;
  --gold-light: #ecd8ad;
  --cream: #fff8e9;
}
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: "IBM Plex Sans Arabic", Tahoma, sans-serif;
  color: white;
  background:
    linear-gradient(135deg, rgba(5,16,31,.12), rgba(10,25,48,.18)),
    url("https://raw.githubusercontent.com/tysoo/Islamic-exams/main/registration-bg.png")
    center / cover fixed no-repeat,
    var(--navy);
}

button, input { font: inherit; }
button { cursor: pointer; }
.hidden { display: none !important; }

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-start;
  padding: 30px 7%;
}

main {
  width: 100%;
  max-width: 390px;
}

.logo-area {
  text-align: center;
  margin-bottom: 12px;
}

.logo-area img {
  width: 112px;
  height: 112px;
  object-fit: contain;
  filter: drop-shadow(0 5px 15px #0006);
}

.card {
  padding: 27px;
  border: 1px solid #d0aa6780;
  border-radius: 21px;
  background: rgba(8,24,44,.88);
  box-shadow: 0 22px 65px #0005;
  backdrop-filter: blur(12px);
}

.heading {
  text-align: center;
  margin-bottom: 21px;
}

.ornament {
  color: var(--gold-light);
  font-size: 22px;
}

h1 {
  font-family: Alexandria, Tahoma, sans-serif;
  color: var(--cream);
  font-size: 24px;
  margin: 4px 0 8px;
}

.heading p {
  color: #d1d9e4;
  font-size: 12px;
  line-height: 1.9;
  margin: 0;
}

.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  padding: 5px;
  margin-bottom: 22px;
  border: 1px solid #d0aa6740;
  background: #071629;
  border-radius: 12px;
}

.tab {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 11px 5px;
  color: #d2d9e2;
  background: transparent;
  font-weight: 700;
  font-size: 13px;
}

.tab.active {
  background: linear-gradient(135deg, #ecd8ad, #c49a50);
  color: #14233a;
}

.form-title {
  font-size: 17px;
  margin: 0 0 5px;
  color: var(--cream);
}

.form-description {
  font-size: 12px;
  color: #c2ccda;
  margin: 0 0 17px;
  line-height: 1.9;
}

.field { margin: 14px 0; }

.field label {
  display: block;
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 7px;
  color: #f2e6cf;
}

.field input {
  width: 100%;
  min-height: 46px;
  padding: 11px 12px;
  border-radius: 10px;
  border: 1px solid #d0aa6755;
  background: #071629;
  color: white;
  outline: none;
  direction: rtl;
}

.field input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px #d0aa6718;
}

.field input::placeholder { color: #9aa6b5; }

.password-wrap { position: relative; }
.password-wrap input { padding-left: 62px; }

.show-password {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  border: 0;
  background: transparent;
  color: var(--gold-light);
  font-size: 11px;
  padding: 5px;
}

.submit {
  width: 100%;
  min-height: 47px;
  border: 0;
  border-radius: 10px;
  margin-top: 9px;
  background: linear-gradient(135deg, #ecd8ad, #c49a50);
  color: #14233a;
  font-weight: 800;
}

.submit:disabled {
  opacity: .65;
  cursor: wait;
}

.message {
  display: none;
  margin-top: 13px;
  padding: 10px;
  border-radius: 9px;
  font-size: 12px;
  line-height: 1.9;
  overflow-wrap: anywhere;
}

.message.show { display: block; }
.message.error {
  color: #ffd9d5;
  background: #8e29252b;
  border: 1px solid #d56a604a;
}
.message.success {
  color: #d5f5df;
  background: #28634535;
  border: 1px solid #6db78c55;
}

.security-note {
  text-align: center;
  color: #c4cfdd;
  font-size: 11px;
  line-height: 1.9;
  margin: 17px 0 0;
}

footer {
  text-align: center;
  padding: 12px;
  color: #e0e4eb;
  font-size: 11px;
}

@media (max-width: 600px) {
  .page {
    justify-content: center;
    padding: 22px 14px;
  }
  main { max-width: 390px; }
  .logo-area img { width: 92px; height: 92px; }
  .card { padding: 22px 18px; }
  h1 { font-size: 22px; }
}
</style>
</head>

<body>
<div class="page">
  <main>
    <div class="logo-area">
      <img
        src="https://raw.githubusercontent.com/tysoo/Islamic-exams/main/marsad-logo.png.jpg"
        alt="شعار المرصد">
    </div>

    <section class="card">
      <div class="heading">
        <div class="ornament">✦</div>
        <h1>مرحبًا بك</h1>
        <p>للنوازل العقدية — سجّل الدخول لمتابعة رحلتك في طلب العلم.</p>
      </div>

      <div class="tabs" role="tablist" aria-label="نوع الحساب">
        <button class="tab active" id="studentTab" type="button"
          role="tab" aria-selected="true">بوابة الطالب</button>
        <button class="tab" id="adminTab" type="button"
          role="tab" aria-selected="false">بوابة الإدارة</button>
      </div>

      <form id="studentForm">
        <h2 class="form-title">دخول الطالب</h2>
        <p class="form-description">أدخل كود الطالب وكلمة المرور الخاصة بحسابك.</p>

        <div class="field">
          <label for="studentCode">كود الطالب</label>
          <input id="studentCode" autocomplete="username"
            required placeholder="اكتب كود الطالب">
        </div>

        <div class="field">
          <label for="studentPassword">كلمة المرور</label>
          <div class="password-wrap">
            <input id="studentPassword" type="password"
              autocomplete="current-password" required
              placeholder="اكتب كلمة المرور">
            <button class="show-password" type="button"
              data-toggle="studentPassword">إظهار</button>
          </div>
        </div>

        <button class="submit" id="studentSubmit" type="submit">
          تسجيل دخول الطالب
        </button>
      </form>

      <form id="adminForm" class="hidden">
        <h2 class="form-title">دخول الإدارة</h2>
        <p class="form-description">الدخول مخصص للحسابات التي لديها صلاحية الإدارة.</p>

        <div class="field">
          <label for="adminEmail">البريد الإلكتروني</label>
          <input id="adminEmail" type="email" autocomplete="username"
            required placeholder="البريد الإلكتروني">
        </div>

        <div class="field">
          <label for="adminPassword">كلمة المرور</label>
          <div class="password-wrap">
            <input id="adminPassword" type="password"
              autocomplete="current-password" required
              placeholder="اكتب كلمة المرور">
            <button class="show-password" type="button"
              data-toggle="adminPassword">إظهار</button>
          </div>
        </div>

        <button class="submit" id="adminSubmit" type="submit">
          تسجيل دخول الإدارة
        </button>
      </form>

      <div id="message" class="message" role="status"
        aria-live="polite"></div>

      <p class="security-note">
        بيانات الدخول خاصة بك. لا تشارك كلمة المرور مع أي شخص.
      </p>
    </section>

    <footer>مَرْصَد — رحلة في طلب العلم</footer>
  </main>
</div>

<script>
(() => {
  'use strict';

  const SUPABASE_URL =
    'https://pxgxnwxpwvvefroaqpfr.supabase.co';

  const SUPABASE_PUBLISHABLE_KEY =
    'sb_publishable_Y1VPWMTp80Sn-yIlAKAPCA_27GhFxtP';

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );

  const $ = id => document.getElementById(id);
  const studentTab = $('studentTab');
  const adminTab = $('adminTab');
  const studentForm = $('studentForm');
  const adminForm = $('adminForm');
  const messageBox = $('message');

  function showMessage(text, type = 'error') {
    messageBox.textContent = text;
    messageBox.className = 'message show ' + type;
  }

  function clearMessage() {
    messageBox.textContent = '';
    messageBox.className = 'message';
  }

  function friendlyError(error) {
    const text = error?.message || String(error || '');

    if (/Invalid login credentials/i.test(text)) {
      return 'بيانات الدخول غير صحيحة. راجع الكود أو البريد الإلكتروني وكلمة المرور.';
    }
    if (/Email not confirmed/i.test(text)) {
      return 'البريد الإلكتروني غير مؤكّد. راجع إعداد الحساب لدى الإدارة.';
    }
    if (/Failed to fetch|NetworkError/i.test(text)) {
      return 'تعذر الاتصال بالخادم. تحقق من الإنترنت وحاول مرة أخرى.';
    }
    return 'تعذر تسجيل الدخول. ' + text;
  }

  function switchTab(type) {
    const isStudent = type === 'student';

    studentForm.classList.toggle('hidden', !isStudent);
    adminForm.classList.toggle('hidden', isStudent);
    studentTab.classList.toggle('active', isStudent);
    adminTab.classList.toggle('active', !isStudent);
    studentTab.setAttribute('aria-selected', String(isStudent));
    adminTab.setAttribute('aria-selected', String(!isStudent));
    clearMessage();
  }

  studentTab.addEventListener('click', () => switchTab('student'));
  adminTab.addEventListener('click', () => switchTab('admin'));

  document.querySelectorAll('[data-toggle]').forEach(button => {
    button.addEventListener('click', () => {
      const input = $(button.dataset.toggle);
      const showing = input.type === 'text';
      input.type = showing ? 'password' : 'text';
      button.textContent = showing ? 'إظهار' : 'إخفاء';
    });
  });

  // دخول الطالب بالكود وكلمة المرور.
  studentForm.addEventListener('submit', async event => {
    event.preventDefault();

    const button = $('studentSubmit');
    const code = $('studentCode').value.trim();
    const password = $('studentPassword').value;

    button.disabled = true;
    button.textContent = 'جارٍ التحقق...';
    clearMessage();

    try {
      const email = `student.${code.toLowerCase()}@login.invalid`;
      const { error } = await db.auth.signInWithPassword({
        email,
        password
      });
      if (error) throw error;

      const { error: dashboardError } =
        await db.rpc('get_student_dashboard');

      if (dashboardError) {
        await db.auth.signOut();
        throw dashboardError;
      }

      window.location.replace('student-portal.html');
    } catch (error) {
      showMessage(friendlyError(error));
    } finally {
      button.disabled = false;
      button.textContent = 'تسجيل دخول الطالب';
    }
  });

  // دخول الإدارة مع التحقق من صلاحية admin.
  adminForm.addEventListener('submit', async event => {
    event.preventDefault();

    const button = $('adminSubmit');
    const email = $('adminEmail').value.trim();
    const password = $('adminPassword').value;

    button.disabled = true;
    button.textContent = 'جارٍ التحقق...';
    clearMessage();

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });
      if (error) throw error;
      if (!data.session) throw new Error('لم يتم إنشاء جلسة دخول صالحة.');

      const { data: profile, error: profileError } = await db
        .from('profiles')
        .select('role')
        .eq('id', data.session.user.id)
        .maybeSingle();

      if (profileError) {
        await db.auth.signOut();
        throw new Error('تعذر التحقق من صلاحية الإدارة: ' + profileError.message);
      }

      if (!profile || profile.role !== 'admin') {
        await db.auth.signOut();
        throw new Error('هذا الحساب لا يملك صلاحية الإدارة.');
      }

      window.location.replace('admin-v2.html');
    } catch (error) {
      showMessage(friendlyError(error));
    } finally {
      button.disabled = false;
      button.textContent = 'تسجيل دخول الإدارة';
    }
  });
})();
</script>
</body>
</html>
