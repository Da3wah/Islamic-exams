<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - للنوازل العقدية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navyDark: '#070E17',
                        navyCard: 'rgba(10, 20, 32, 0.82)',
                        navyBorder: 'rgba(232, 216, 200, 0.18)',
                        // اللون الكريمي الرئيسي
                        creamLight: '#FAF0E6',
                        creamBase: '#F5E6D3',
                        creamSoft: '#E8D8C8',
                        creamMuted: '#C8B8A5',
                        // الذهبي (خاص بمربع اللوجو فقط)
                        goldLogo: '#D4AF37',
                        goldLogoDark: '#A68B2C',
                        mutedText: '#9AA8B8'
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #070E17;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* توهج كلاسيكي ذهبي لمربع اللوجو فقط */
        .logo-gold-glow {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.25);
        }

        /* توهج ناعم كريمي لكارت تسجيل الدخول */
        .cream-card-glow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(245, 230, 211, 0.05);
        }

        /* التدرج الكريمي الفاخر لزر الدخول الرئيسي */
        .cream-gradient {
            background: linear-gradient(135deg, #FAF0E6 0%, #E8D8C8 50%, #C4B097 100%);
        }

        /* خلفية الصفحة كاملة باستخدام الصورة المرفقة */
        .page-bg {
            background-image: url('registration-bg.png');
            background-size: cover;
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        /* تأثير زجاجي معتم ورائع للكارت */
        .glass-panel {
            background: rgba(8, 16, 27, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(245, 230, 211, 0.2);
        }
    </style>
</head>
<body class="page-bg min-h-screen relative flex items-center justify-center lg:justify-start p-4 sm:p-6 lg:p-12">

    <!-- طبقة تظليل خفيفة على الصورة لزيادة وضوح كارت الدخول -->
    <div class="fixed inset-0 bg-gradient-to-r from-black/40 via-black/20 to-black/60 pointer-events-none"></div>

    <!-- كارت تسجيل الدخول المتموقع على اليمين -->
    <div class="relative z-10 w-full max-w-lg glass-panel rounded-3xl p-6 sm:p-10 cream-card-glow flex flex-col justify-between my-auto">
        
        <!-- المحتوى الرئيسي لكارت الدخول -->
        <div>
            <!-- مربع اللوجو الملتزم باللون الذهبي الغامق فقط حصرياً -->
            <div class="text-center mb-6 sm:mb-8">
                <div class="relative inline-block">
                    <div class="w-36 h-28 mx-auto rounded-xl border-2 border-goldLogo/80 bg-navyDark/90 flex flex-col items-center justify-center p-4 logo-gold-glow relative overflow-hidden group hover:border-goldLogo transition-all duration-300">
                        <!-- زخرفة الزوايا الذهبية -->
                        <div class="absolute top-1 left-1 w-2.5 h-2.5 border-t-2 border-l-2 border-goldLogo"></div>
                        <div class="absolute top-1 right-1 w-2.5 h-2.5 border-t-2 border-r-2 border-goldLogo"></div>
                        <div class="absolute bottom-1 left-1 w-2.5 h-2.5 border-b-2 border-l-2 border-goldLogo"></div>
                        <div class="absolute bottom-1 right-1 w-2.5 h-2.5 border-b-2 border-r-2 border-goldLogo"></div>
                        
                        <i class="fa-regular fa-image text-3xl text-goldLogo mb-1.5"></i>
                        <span class="text-xs font-bold text-goldLogo tracking-wider">هنا اللوجو</span>
                    </div>
                </div>
                
                <!-- العنوان الرئيسي والفرعي باللون الكريمي -->
                <h1 class="text-2xl sm:text-3xl font-black text-creamBase mt-5 tracking-wide">للنـوازل العقديـة</h1>
                <p class="text-creamMuted text-xs sm:text-sm mt-1.5 font-medium">نرصد التعلم ... ونصحح المسار</p>
            </div>

            <!-- نموذج الإدخال -->
            <form onsubmit="handleLogin(event)" class="space-y-4 sm:space-y-5">
                
                <!-- أزرار التبديل (دخول الإدارة / دخول الطالب) باللون الكريمي للزر النشط -->
                <div class="flex bg-black/40 p-1.5 rounded-xl border border-creamBase/20 shadow-inner">
                    <button type="button" id="adminBtn" onclick="switchTab('admin')" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 bg-[#16273e]/90 text-creamBase shadow-md border border-creamBase/30">
                        دخول الإدارة
                    </button>
                    <button type="button" id="studentBtn" onclick="switchTab('student')" class="flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 text-mutedText hover:text-creamLight">
                        دخول الطالب
                    </button>
                </div>

                <!-- حقل اسم المستخدم بإطار وأيقونة باللون الكريمي -->
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-creamBase/80">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" id="username" required placeholder="اسم المستخدم" 
                        class="w-full pr-11 pl-4 py-3.5 bg-black/30 border border-creamBase/30 rounded-xl text-creamLight placeholder:text-mutedText/70 focus:outline-none focus:border-creamBase focus:ring-1 focus:ring-creamBase transition-all text-sm font-medium">
                </div>

                <!-- حقل كلمة المرور بإطار وأيقونة باللون الكريمي -->
                <div class="relative">
                    <span class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none text-creamBase/80">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" id="password" required placeholder="كلمة المرور" 
                        class="w-full pr-11 pl-11 py-3.5 bg-black/30 border border-creamBase/30 rounded-xl text-creamLight placeholder:text-mutedText/70 focus:outline-none focus:border-creamBase focus:ring-1 focus:ring-creamBase transition-all text-sm font-medium">
                    <button type="button" onclick="togglePassword()" class="absolute inset-y-0 left-0 pl-4 flex items-center text-mutedText hover:text-creamBase transition-colors">
                        <i class="fa-regular fa-eye" id="eyeIcon"></i>
                    </button>
                </div>

                <!-- زر الدخول الرئيسي بلون كريمي فاخر مع نص داكن لقراءة ممتازة -->
                <button type="submit" class="w-full py-3.5 cream-gradient text-navyDark font-black rounded-xl shadow-lg hover:brightness-105 active:scale-[0.99] transition-all duration-200 text-base tracking-wide mt-2">
                    دخول
                </button>

                <!-- رابط نسيت كلمة المرور -->
                <div class="text-center pt-1">
                    <a href="#forgot" onclick="showMsg('تم إرسال تعليمات استعادة كلمة المرور إلى البريد المسجل.')" class="text-creamMuted hover:text-creamBase text-xs sm:text-sm font-medium transition-colors">
                        نسيت كلمة المرور؟
                    </a>
                </div>
            </form>
        </div>

        <!-- الشريط السفلي للخدمات في أسفل الكارت -->
        <div class="w-full pt-6 mt-6 border-t border-creamBase/15">
            <div class="flex items-center justify-between text-center px-1">
                
                <div class="flex items-center space-x-2 space-x-reverse group cursor-pointer">
                    <div class="w-8 h-8 rounded-full border border-creamBase/40 flex items-center justify-center text-creamBase bg-black/30 group-hover:border-creamBase group-hover:bg-creamBase/10 transition-all">
                        <i class="fa-solid fa-eye text-xs"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-creamBase/90 group-hover:text-creamLight transition-colors">رصد الأفكار الهدامة</span>
                </div>

                <div class="w-px h-4 bg-creamBase/20"></div>

                <div class="flex items-center space-x-2 space-x-reverse group cursor-pointer">
                    <div class="w-8 h-8 rounded-full border border-creamBase/40 flex items-center justify-center text-creamBase bg-black/30 group-hover:border-creamBase group-hover:bg-creamBase/10 transition-all">
                        <i class="fa-solid fa-filter text-xs"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-creamBase/90 group-hover:text-creamLight transition-colors">كشف الأخطاء</span>
                </div>

                <div class="w-px h-4 bg-creamBase/20"></div>

                <div class="flex items-center space-x-2 space-x-reverse group cursor-pointer">
                    <div class="w-8 h-8 rounded-full border border-creamBase/40 flex items-center justify-center text-creamBase bg-black/30 group-hover:border-creamBase group-hover:bg-creamBase/10 transition-all">
                        <i class="fa-solid fa-compass text-xs"></i>
                    </div>
                    <span class="text-[11px] sm:text-xs font-semibold text-creamBase/90 group-hover:text-creamLight transition-colors">تصحيح المسار</span>
                </div>

            </div>
        </div>

    </div>

    <!-- نافذة رسائل التنبيه المخصصة باللون الكريمي -->
    <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel rounded-2xl p-6 max-w-sm w-full mx-4 text-center shadow-2xl">
            <div class="w-12 h-12 rounded-full bg-creamBase/10 text-creamBase flex items-center justify-center mx-auto mb-4 text-xl border border-creamBase/30">
                <i class="fa-solid fa-info"></i>
            </div>
            <h3 id="modalTitle" class="text-lg font-bold text-creamBase mb-2">تنبيه النظام</h3>
            <p id="modalText" class="text-creamMuted text-sm mb-6"></p>
            <button onclick="closeMsg()" class="w-full py-2.5 cream-gradient text-navyDark font-bold rounded-xl text-sm transition-all shadow-md">
                حسناً
            </button>
        </div>
    </div>

    <!-- مكتبة Supabase للاتصال بمشروع المرصد -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- سكريبت التفاعل والتحكم -->
    <script>
        let currentRole = 'admin';

        function switchTab(role) {
            currentRole = role;
            const adminBtn = document.getElementById('adminBtn');
            const studentBtn = document.getElementById('studentBtn');
            const usernameInput = document.getElementById('username');

            if (role === 'admin') {
                adminBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 bg-[#16273e]/90 text-creamBase shadow-md border border-creamBase/30";
                studentBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 text-mutedText hover:text-creamLight";
                usernameInput.placeholder = "اسم المستخدم";
            } else {
                studentBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 bg-[#16273e]/90 text-creamBase shadow-md border border-creamBase/30";
                adminBtn.className = "flex-1 py-2.5 text-xs sm:text-sm font-bold rounded-lg transition-all duration-300 text-mutedText hover:text-creamLight";
                usernameInput.placeholder = "اسم الطالب أو رقم القيد";
            }
        }
const requestedRole = new URLSearchParams(
    window.location.search
).get('role');

if (requestedRole === 'student') {
    switchTab('student');
} else {
    switchTab('admin');
}
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = "fa-regular fa-eye-slash";
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = "fa-regular fa-eye";
            }
        }

        // إعداد الاتصال بمشروع Supabase الحالي في منصة المرصد.
        const SUPABASE_URL = 'https://pxgxnwxpwvvefroaqpfr.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Y1VPWMTp80Sn-yIlAKAPCA_27GhFxtP';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const submitButton = event.submitter || event.target.querySelector('button[type="submit"]');
            if (!username || !password) {
                showMsg('من فضلك أدخل اسم المستخدم وكلمة المرور.');
                return;
            }

            if (submitButton) {
                submitButton.disabled = true;
                submitButton.textContent = 'جارٍ التحقق...';
            }

            try {
                if (currentRole === 'student') {
                    // تسجيل الطالب بالكود وفق صيغة الحساب المستخدمة بالفعل في المنصة.
                    const email = `student.${username.toLowerCase()}@login.invalid`;
                    const { error: loginError } = await db.auth.signInWithPassword({
                        email,
                        password
                    });
                    if (loginError) throw loginError;

                    const { error: dashboardError } = await db.rpc('get_student_dashboard');
                    if (dashboardError) {
                        await db.auth.signOut();
                        throw dashboardError;
                    }

                    window.location.replace('student-portal.html');
                    return;
                }

                // تسجيل الإدارة بالبريد الإلكتروني، ثم التحقق من الدور من جدول profiles.
                const { data, error: loginError } = await db.auth.signInWithPassword({
                    email: username,
                    password
                });
                if (loginError) throw loginError;
                if (!data.session) throw new Error('لم يتم إنشاء جلسة دخول صالحة.');

                const { data: profile, error: profileError } = await db
                    .from('profiles')
                    .select('role')
                    .eq('id', data.session.user.id)
                    .maybeSingle();

                if (profileError) {
                    await db.auth.signOut();
                    throw new Error('تعذر التحقق من صلاحية الإدارة: ' + profileError.message);
                }

                if (!profile || profile.role !== 'admin') {
                    await db.auth.signOut();
                    throw new Error('هذا الحساب لا يملك صلاحية الإدارة.');
                }

                window.location.replace('admin-v2.html');
            } catch (error) {
                const detail = error && error.message ? error.message : String(error);
                if (/Invalid login credentials/i.test(detail)) {
                    showMsg('بيانات الدخول غير صحيحة. راجع كود الطالب أو البريد الإلكتروني وكلمة المرور.');
                } else if (/Failed to fetch|NetworkError/i.test(detail)) {
                    showMsg('تعذر الاتصال بالخادم. تحقق من الإنترنت ثم حاول مرة أخرى.');
                } else {
                    showMsg('تعذر تسجيل الدخول: ' + detail);
                }
            } finally {
                if (submitButton) {
                    submitButton.disabled = false;
                    submitButton.textContent = 'دخول';
                }
            }
        }

        function showMsg(text) {
            const modal = document.getElementById('customModal');
            document.getElementById('modalText').innerText = text;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeMsg() {
            const modal = document.getElementById('customModal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }
    </script>

</body>
</html>
